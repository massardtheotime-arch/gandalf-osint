name: Build — Windows EXE & macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller pywebview yt-dlp openpyxl pillow

      - name: Download ffmpeg (Windows)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Downloading ffmpeg..."
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Write-Host "Extracting..."
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $binp = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $bin.FullName -Destination "ffmpeg.exe"
          Copy-Item $binp.FullName -Destination "ffprobe.exe"
          Write-Host "ffmpeg.exe and ffprobe.exe ready."

      - name: Generate Windows icon
        run: python generate_icon.py

      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name GandalfOSINT `
            --collect-all yt_dlp `
            --collect-all webview `
            --add-data "app.html;." `
            --add-data "gandalf.gif;." `
            --add-data "gollum.png;." `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            -y `
            downloader_app.py
        shell: pwsh
        run: |
          $pyiArgs = @(
            "--onefile",
            "--windowed",
            "--name", "GandalfOSINT",
            "--collect-all", "yt_dlp",
            "--collect-all", "webview",
            "--add-data", "app.html;.",
            "--add-data", "gandalf.gif;.",
            "--add-binary", "ffmpeg.exe;.",
            "--add-binary", "ffprobe.exe;.",
            "-y",
            "downloader_app.py"
          )
          if (Test-Path "icon.ico") {
            $pyiArgs = @("--icon", "icon.ico") + $pyiArgs
          }
          pyinstaller @pyiArgs

      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/GandalfOSINT.exe")) {
            Write-Error "GandalfOSINT.exe not found in dist/"
            exit 1
          }
          Write-Host "GandalfOSINT.exe size: $((Get-Item dist/GandalfOSINT.exe).Length / 1MB) MB"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GandalfOSINT-Windows
          path: dist/GandalfOSINT.exe

  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller pywebview yt-dlp openpyxl pillow
          brew install ffmpeg create-dmg

      - name: Build APP
        run: |
          FFMPEG_PATH=$(which ffmpeg)
          FFPROBE_PATH=$(which ffprobe)
          pyinstaller \
            --onedir \
            --windowed \
            --name GandalfOSINT \
            --icon icon.icns \
            --collect-all yt_dlp \
            --collect-all webview \
            --add-data "app.html:." \
            --add-data "gandalf.gif:." \
            --add-binary "$FFMPEG_PATH:." \
            --add-binary "$FFPROBE_PATH:." \
            -y \
            downloader_app.py

      - name: Verify .app bundle
        run: |
          ls -la dist/
          test -d "dist/GandalfOSINT.app" && echo ".app found" || true
          ls -laR dist/GandalfOSINT.app/ 2>/dev/null | head -30 || true

      - name: Create DMG
        run: |
          rm -f GandalfOSINT.dmg
          create-dmg \
            --volname "Gandalf OSINT" \
            --window-size 600 380 \
            --icon-size 120 \
            --icon "GandalfOSINT.app" 150 185 \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "GandalfOSINT.dmg" \
            "dist/GandalfOSINT.app" \
            || true

      - name: Fallback — zip if DMG failed
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f "GandalfOSINT.dmg" ]; then
            echo "DMG creation failed, falling back to zip"
            cd dist && zip -r ../GandalfOSINT.zip GandalfOSINT.app
          fi

      - name: Upload macOS artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: GandalfOSINT-macOS
          path: |
            GandalfOSINT.dmg
            GandalfOSINT.zip
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [build-windows, build-macos]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: false

      - name: List artifacts
        run: find . -type f | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GandalfOSINT-Windows/GandalfOSINT.exe
            GandalfOSINT-macOS/GandalfOSINT.dmg
            GandalfOSINT-macOS/GandalfOSINT.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
